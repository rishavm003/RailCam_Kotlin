# XcodeGen spec for the RailCam iOS app.
# Generate the Xcode project on a Mac with:  brew install xcodegen && cd ios && xcodegen generate
# The generated RailCam.xcodeproj is not committed; this file is the source of truth.
name: RailCam
options:
  bundleIdPrefix: com.rishavmishra010
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RailCam:
    type: application
    platform: iOS
    sources:
      - path: RailCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishavmishra010.railcam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RailCam/Info.plist
    info:
      path: RailCam/Info.plist
      properties:
        CFBundleDisplayName: RailCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: RailCam uses the camera to photograph rail sections for inspection.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  RailCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RailCamTests
    dependencies:
      - target: RailCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rishavmishra010.railcam.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RailCam:
    build:
      targets:
        RailCam: all
        RailCamTests: [test]
    test:
      targets:
        - RailCamTests
